    <script>
            // --- MONITOR DE RECURSOS ZENITH ---
            (function () {
                console.log("🕵️ [SISTEMA]: Monitor de Recursos Ativado.");

                // Observa cada arquivo carregado
                const observer = new PerformanceObserver((list) => {
                    list.getEntries().forEach((entry) => {
                        const fileName = entry.name.split('/').pop();
                        if (fileName && !entry.name.includes('/api/logs')) {
                            const msg = `📦 [ARQUIVO]: ${fileName} carregado em ${Math.round(entry.duration)}ms (${Math.round(entry.transferSize / 1024)} KB)`;
                            console.log(msg);
                            // Tenta enviar para o terminal do Node
                            if (window.location.protocol !== 'file:') {
                                fetch('/api/logs', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ message: msg, type: 'info' })
                                }).catch(() => { });
                            }
                        }
                    });
                });
                observer.observe({ entryTypes: ["resource"] });

                window.addEventListener('DOMContentLoaded', () => {
                    const msg = "🏗️ [DOM]: Estrutura básica carregada. Iniciando montagem do motor...";
                    console.log(msg);
                    if (window.location.protocol !== 'file:') { fetch('/api/logs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) }).catch(() => { }); }
                });

                window.addEventListener('load', () => {
                    const msg = "🏁 [SISTEMA]: Todos os arquivos base foram baixados. O motor está em ignição!";
                    console.log(msg);
                    if (window.location.protocol !== 'file:') { fetch('/api/logs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) }).catch(() => { }); }
                });
            })();
    </script>

    <style>
        :root {
            --loader-primary-color: #192d40;
            --loader-secondary-color: #192d40;
        }

        body.loading.with-progress #loader .overlay {
            --app-overlay-background-color: #f2f2f2;
        }

        @keyframes load {
            0% {
                border-color: rgba(128, 204, 70, 0) var(--loader-secondary-color) rgba(27, 160, 243, 0) var(--loader-primary-color);
                transform: rotate(0deg);
            }

            50% {
                border-color: var(--loader-primary-color) rgba(27, 160, 243, 0) var(--loader-secondary-color) rgba(128, 204, 70, 0);
                transform: rotate(180deg);
            }

            100% {
                border-color: rgba(128, 204, 70, 0) var(--loader-secondary-color) rgba(27, 160, 243, 0) var(--loader-primary-color);
                transform: rotate(360deg);
            }
        }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            background: #161616;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body #loader {
            display: none;
        }

        body #appMaster .nelo-dialog,
        body #appMaster .ui-dialog {
            -moz-transition: opacity 1s ease-in-out;
            -ms-transition: opacity 1s ease-in-out;
            -o-transition: opacity 1s ease-in-out;
            -webkit-transition: opacity 1s ease-in-out;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        body.loading.with-progress #loaderSpinner {
            display: none !important;
        }

        body.loading:not(.with-progress) #loaderPercentage {
            display: none !important;
        }

        body.loading #appMaster .nelo-dialog,
        body.loading #appMaster .ui-dialog {
            opacity: 0;
        }

        body.loading #loader {
            display: block;
            height: 100%;
            left: 0;
            position: absolute;
            top: 0;
            width: 100%;
            overflow: hidden;

            z-index: 10000;
            clear: both;
        }
